<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colun Studios</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      color: #ffffff;
      background-color: #050508;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Fondo abstracto canvas */
    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Contenedor principal con fondo que se oscurece al bajar */
    .page-container {
      background: linear-gradient(to bottom, rgba(5, 5, 8, 0.2) 0%, rgba(5, 5, 8, 0.8) 50%, #050508 100%);
      min-height: 250vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 20px 80px;
    }

    /* Sección Superior */
    .top-section {
      text-align: center;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo Estilo App (Squircle) */
    .app-logo {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 20px;
      transition: transform 0.3s ease;
    }

    .app-logo:hover {
      transform: scale(1.05) rotate(2deg);
    }

    .main-title {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ffffff, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: pulseTitle 3s ease-in-out infinite alternate;
    }

    @keyframes pulseTitle {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    .subtitle {
      font-size: 1.5rem;
      color: #e0e0e0;
      margin-top: 15px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .community-title {
      font-size: 1.8rem;
      color: #ffffff;
      margin-top: 40px;
      margin-bottom: 20px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    /* Botón de Roblox */
    .roblox-btn {
      display: inline-block;
      background: linear-gradient(135deg, #e11c1c, #9e0000);
      color: #ffffff;
      font-size: 2rem;
      font-weight: 800;
      text-decoration: none;
      padding: 20px 60px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(225, 28, 28, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .roblox-btn:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 15px 35px rgba(225, 28, 28, 0.6), 0 0 15px rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, #ff2a2a, #be0000);
    }

    /* Sección Video Recomendado */
    .video-section {
      margin-top: 50px;
      text-align: center;
      width: 100%;
      max-width: 600px;
    }

    .video-title {
      font-size: 1.3rem;
      color: #00f2fe;
      margin-bottom: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Sección Inferior */
    .bottom-section {
      text-align: center;
      margin-top: 80vh;
    }

    .final-text {
      font-size: 4rem;
      font-weight: 900;
      color: #1a1a24;
      text-transform: lowercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    /* Botón flotante para volver arriba */
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 15px 25px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    .scroll-top-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .scroll-top-btn:hover {
      background: #ffffff;
      color: #000000;
      transform: translateY(-3px);
    }

    @media (max-width: 768px) {
      .app-logo {
        width: 100px;
        height: 100px;
        border-radius: 22px;
      }
      .main-title {
        font-size: 2.8rem;
        letter-spacing: 2px;
      }
      .subtitle {
        font-size: 1.1rem;
      }
      .community-title {
        font-size: 1.3rem;
      }
      .roblox-btn {
        font-size: 1.5rem;
        padding: 15px 40px;
      }
      .final-text {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Fondo animado fluido -->
  <canvas id="canvas-bg"></canvas>

  <div class="page-container">
    <!-- Parte Superior -->
    <div class="top-section">
      <!-- Logo tipo app (ahora con logo.png) -->
      <img src="logo.png" alt="Colun Studios Logo" class="app-logo">

      <h1 class="main-title">COLUN STUDIOS</h1>
      <p class="subtitle">no hay nada por ahora</p>

      <p class="community-title">Unanse a nuestra comunidad</p>
      <a href="https://www.roblox.com/share/g/127853389" target="_blank" class="roblox-btn">Roblox</a>

      <!-- Video recomendado -->
      <div class="video-section">
        <p class="video-title">Video recomendado</p>
        <div class="video-wrapper">
          <iframe 
            src="https://www.youtube.com/embed/osuUd3hOYrs" 
            title="Video recomendado" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>

    <!-- Parte Inferior -->
    <div class="bottom-section">
      <div class="final-text">xd buena</div>
    </div>
  </div>

  <!-- Botón Volver arriba -->
  <button class="scroll-top-btn" id="scrollTopBtn">↑ Volver arriba</button>

  <script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const blobs = [
      { x: 0, y: 0, vx: 0.8, vy: 0.6, radius: 400, color: '#4facfe' },
      { x: 0, y: 0, vx: -0.7, vy: 0.9, radius: 450, color: '#00f2fe' },
      { x: 0, y: 0, vx: 0.5, vy: -0.8, radius: 500, color: '#6b11ff' },
      { x: 0, y: 0, vx: -0.6, vy: -0.5, radius: 350, color: '#ff0844' }
    ];

    blobs.forEach(blob => {
      blob.x = Math.random() * width;
      blob.y = Math.random() * height;
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);

      blobs.forEach(blob => {
        blob.x += blob.vx;
        blob.y += blob.vy;

        if (blob.x < -100 || blob.x > width + 100) blob.vx *= -1;
        if (blob.y < -100 || blob.y > height + 100) blob.vy *= -1;

        const gradient = ctx.createRadialGradient(
          blob.x, blob.y, 0,
          blob.x, blob.y, blob.radius
        );
        gradient.addColorStop(0, blob.color);
        gradient.addColorStop(1, 'transparent');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }
    animate();

    const scrollTopBtn = document.getElementById('scrollTopBtn');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        scrollTopBtn.classList.add('visible');
      } else {
        scrollTopBtn.classList.remove('visible');
      }
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>

</body>
</html>
